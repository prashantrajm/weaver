name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: apple/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apple/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        working-directory: apple
        run: swift build

      - name: Test
        working-directory: apple
        # The e2e MITM tests reach real hosts; the live system-proxy test is
        # opt-in and stays skipped here.
        run: swift test
