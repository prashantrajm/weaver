name: Release

# Every merge to main whose Info.plist version has no tag yet becomes a
# release: build → Developer ID sign → notarize → staple → DMG → GitHub
# release. Merges that don't bump the version are no-ops here (CI still runs).
#
# Required repository secrets (see apple/scripts/ci-secrets.sh to upload them):
#   DEVELOPER_ID_P12_BASE64    Developer ID Application cert + key, .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  password for that .p12
#   NOTARY_KEY_P8_BASE64       App Store Connect API key (.p8), base64 — same team as the cert
#   NOTARY_KEY_ID              its key id
#   NOTARY_ISSUER_ID           its issuer id

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, publish
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw -o - apple/apps/macos/Resources/Info.plist)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Info.plist version: $VERSION"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${{ steps.version.outputs.tag }} already exists — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check secrets
        if: steps.check.outputs.skip == 'false'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=()
          [[ -n "$P12" ]] || missing+=(DEVELOPER_ID_P12_BASE64)
          [[ -n "$P8" ]] || missing+=(NOTARY_KEY_P8_BASE64)
          [[ -n "$KEY_ID" ]] || missing+=(NOTARY_KEY_ID)
          [[ -n "$ISSUER" ]] || missing+=(NOTARY_ISSUER_ID)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. Run apple/scripts/ci-secrets.sh, then re-run this workflow."
            exit 1
          fi

      - name: Select Xcode
        if: steps.check.outputs.skip == 'false'
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Import signing certificate
        if: steps.check.outputs.skip == 'false'
        id: sign
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [[ -n "$IDENTITY" ]] || { echo "::error::No Developer ID Application identity in the .p12"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Signing as: $IDENTITY"

      - name: Write notary key
        if: steps.check.outputs.skip == 'false'
        env:
          P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, notarize, package
        if: steps.check.outputs.skip == 'false'
        working-directory: apple
        env:
          WEAVER_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          WEAVER_NOTARY_KEY: ${{ runner.temp }}/AuthKey.p8
          WEAVER_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          WEAVER_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/release-macos.sh

      - name: Release notes from CHANGELOG
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Section for this version: from "## <version>" up to the next "## ".
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "No CHANGELOG section for $VERSION; using a generic body" >&2
            echo "Weaver $VERSION for macOS." > "$RUNNER_TEMP/notes.md"
          fi
          {
            echo
            echo "## Install"
            echo
            echo "Download \`Weaver-$VERSION.dmg\` below, open it, and drag Weaver to Applications."
            echo "Signed with a Developer ID certificate and notarized by Apple. macOS 14 or later, universal binary."
            echo
            echo "SHA-256 in \`Weaver-$VERSION.dmg.sha256\`."
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create tag and GitHub release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Weaver $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "apple/build/dist/Weaver-$VERSION.dmg" \
            "apple/build/dist/Weaver-$VERSION.dmg.sha256"
          echo "Released $TAG"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
